# API-143 / DEC-078: the Graphite documentation site.
# Pull requests build and check the site. A release tag (v*) also runs every notebook
# and publishes site/ to GitHub Pages; the custom domain (ergodic.dev, from the CNAME
# the build writes) is configured in the repository's Pages settings.
name: Documentation
on:
  pull_request:
    paths:
      - "docsite/**"
      - "scripts/docsite/**"
      - "src/**"
      - "docs/learn/**"
      - "docs/case-studies/**"
      - "tests/test_docsite.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/docs.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_VERSION: "0.9.5"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --frozen
      # ergodic.welt imports welt-client, which reaches PyPI with its 0.13 release.
      # Until then the reference skips that module with a warning; once welt-client
      # 0.13 is published, the extra is installed and the build requires the page.
      - name: Install the Welt bridge once welt-client 0.13 is on PyPI
        run: |
          published=$(curl -fsS https://pypi.org/pypi/welt-client/json | python3 -c 'import json, sys; r = json.load(sys.stdin)["releases"]; print(any(tuple(int(x) for x in v.split(".")[:2]) >= (0, 13) for v in r if all(p.isdigit() for p in v.split("."))))' || echo False)
          if grep -q "^welt = " pyproject.toml && [ "$published" = "True" ]; then
            uv sync --frozen --extra welt
            echo "DOCS_REQUIRE_OPTIONAL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::welt-client 0.13 is not on PyPI (or no welt extra yet): the ergodic.welt reference page is skipped"
          fi
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
      - name: Builder tests
        run: uv run pytest -q tests/test_docsite.py
      - name: Run page programs, check excerpts, recorded outputs and links
        run: make docs-check
      - name: Release tags must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run python -c "import ergodic; print(ergodic.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: Rebuild retained versions from their own tags
        run: |
          for old in $(uv run python -c "import tomllib; print(' '.join(tomllib.load(open('docsite/site.toml', 'rb'))['versions']['previous']))"); do
            git worktree add "../docs-v$old" "v$old"
            (cd "../docs-v$old" && uv sync --frozen && uv run python -m scripts.docsite build --allow-undocumented --output "$GITHUB_WORKSPACE/site")
          done
      - name: Build the current version
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
        run: uv run python -m scripts.docsite build --output site --report site-report/reference-coverage.json
      - run: uv run python -m scripts.docsite links site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 7
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  notebooks:
    # Notebooks never run at build time; a release runs them all once.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --frozen --group docs
      - run: make docs-notebooks

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, notebooks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
