# Builds, verifies and publishes ergodic to PyPI with Trusted Publishing.
#
# - A pushed tag `vX.Y.Z` runs the full CI matrix, builds the sdist and wheel,
#   checks that the tag equals `ergodic.__version__` and the built metadata,
#   smoke-installs both artifacts in clean virtual environments, then publishes
#   to PyPI from the `pypi` environment.
# - A manual run (workflow_dispatch) does the same checks and, only when the
#   `testpypi` input is ticked, publishes to TestPyPI from the `testpypi`
#   environment. A manual run never publishes to PyPI.
#
# No token secrets: both indexes trust this workflow file through OIDC
# (`id-token: write`). See RELEASING.md for the one-time publisher setup.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish the built distributions to TestPyPI (dry run; never PyPI)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: make check
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.8"
          # No dependency cache on a publishing run.
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Check distribution metadata (twine check --strict)
        run: uvx --from 'twine==7.0.0' twine check --strict dist/*

      - name: Smoke-install the wheel and the sdist in clean environments
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/ergodic-*-py3-none-any.whl)
          sdists=(dist/ergodic-*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel and one sdist in dist/"; ls -l dist; exit 1
          fi
          built="${wheels[0]#dist/ergodic-}"; built="${built%%-*}"
          echo "Built version: $built"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$built" ]; then
            echo "::error::tag $REF_NAME does not match the built version $built"; exit 1
          fi
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            env_dir="$RUNNER_TEMP/smoke-$(basename "$artifact")"
            uv venv --python 3.12 "$env_dir"
            uv pip install --python "$env_dir/bin/python" "$artifact"
            # Run from an empty directory so the checkout's src/ cannot shadow
            # the installed package.
            (cd "$RUNNER_TEMP" && EXPECTED="$built" REF_TYPE="$REF_TYPE" REF_NAME="$REF_NAME" \
              "$env_dir/bin/python" -I -c '
          import os, sys
          import ergodic
          from ergodic import dag
          expected = os.environ["EXPECTED"]
          assert ergodic.__version__ == expected, (ergodic.__version__, expected)
          if os.environ["REF_TYPE"] == "tag":
              assert os.environ["REF_NAME"] == "v" + ergodic.__version__, "tag != ergodic.__version__"
          g = dag(["X -> Y", "Y -> Z"])
          assert g.d_separated("X", "Z", "Y")
          assert "pymc" not in sys.modules, "the core import must not pull in pymc"
          print("ok", ergodic.__version__, ergodic.__file__)
          ')
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [check, build]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ergodic/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: [check, build]
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ergodic/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
