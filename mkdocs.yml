site_name: Ergodic
site_description: "Causal AI: causal discovery, causal inference, and process intelligence."
site_url: https://ergodic.ai
copyright: Copyright &copy; 2026 Ergodic
repo_url: https://github.com/ergodic-ai/ergodic
repo_name: ergodic-ai/ergodic

theme:
  name: material
  logo: assets/ergodic_logomark_dark.svg
  favicon: assets/ergodic_logomark_dark.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ergodic-ai/ergodic
    - icon: material/web
      link: https://ergodic.ai

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.py"]
      execute: true
      allow_errors: false
      kernel_name: python3
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Get started:
      - tutorial.md
      - Concepts: concepts.md
  - Learn:
      - learn/index.md
      - The series:
          - 1. Why causality: learn/01-why-causality.py
          - 2. Good and bad controls: learn/02-good-and-bad-controls.py
          - 3. Estimating effects: learn/03-estimating-effects.py
          - 4. Heterogeneous effects: learn/04-heterogeneous-effects.py
          - 5. Hidden confounding: learn/05-hidden-confounding.py
          - 6. Discovering structure: learn/06-discovering-structure.py
          - 7. Quasi-experiments: learn/07-quasi-experiments.py
          - 8. Process mining: learn/08-process-mining.py
          - 9. Process intelligence: learn/09-process-intelligence.py
          - 10. Decision points: learn/10-decision-points.py
          - 11. Forecasting: learn/11-forecasting.py
      - Case studies:
          - case-studies/index.md
          - Smoking and birthweight: case-studies/01-birthweight.py
          - Berkeley admissions, 1973: case-studies/02-berkeley.py
          - 401(k) eligibility and wealth: case-studies/03-pension401k.py
          - Proposition 99 and synthetic control: case-studies/04-synthetic-control.py
          - Discovery on a known network: case-studies/05-discovery.py
          - Customer lifetime value: case-studies/06-clv.py
          - Customer churn: case-studies/07-churn.py
  - Foundations:
      - foundations.md
      - Causal graphs: graph.md
      - Domain knowledge: knowledge.md
      - Data: data.md
      - Identification: identification.md
  - Pillars:
      - pillars.md
      - Causal discovery: discovery.md
      - Causal inference: inference.md
      - Panel designs: panel.md
      - Forecasting: forecast.md
      - Process intelligence: process.md
      - Structural causal models: scm.md
  - Reference:
      - reference.md
      - Glossary: glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - docs
  - pymdownx.mark
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
