site_name: Ergodic
site_description: "Causal AI: causal discovery, causal inference, and process intelligence."
site_url: https://ergodic.ai
copyright: Copyright &copy; 2026 Ergodic

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.py"]
      execute: true
      allow_errors: false
      kernel_name: python3
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Getting started: tutorial.md
  - Learn causal inference:
      - Start here: learn/index.md
      - 1. Why causality: learn/01-why-causality.py
      - 2. Good and bad controls: learn/02-good-and-bad-controls.py
      - 3. Estimating effects: learn/03-estimating-effects.py
      - 4. Heterogeneous effects: learn/04-heterogeneous-effects.py
      - 5. Hidden confounding: learn/05-hidden-confounding.py
      - 6. Discovering structure: learn/06-discovering-structure.py
      - 7. Quasi-experiments: learn/07-quasi-experiments.py
      - 8. Process mining: learn/08-process-mining.py
      - 9. Process intelligence: learn/09-process-intelligence.py
      - 10. Decision points: learn/10-decision-points.py
  - Case studies:
      - Start here: case-studies/index.md
      - Smoking and birthweight: case-studies/01-birthweight.py
      - Berkeley admissions, 1973: case-studies/02-berkeley.py
      - 401(k) eligibility and wealth: case-studies/03-pension401k.py
      - Proposition 99 and synthetic control: case-studies/04-synthetic-control.py
      - Discovery on a known network: case-studies/05-discovery.py
  - Concepts: concepts.md
  - Guides:
      - Causal graphs: graph.md
      - Domain knowledge: knowledge.md
      - Data: data.md
      - Identification: identification.md
  - Pillars:
      - Causal Discovery: discovery.md
      - Causal Inference: inference.md
      - Panel designs: panel.md
      - Process Intelligence: process.md
      - Structural causal models: scm.md
  - API Reference: reference.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
