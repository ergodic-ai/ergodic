[landing]
eyebrow = "Python 3.11+ · Apache-2.0"
title = "From data"
title_muted = "to a causal effect."
lead = "Learn a causal graph from your data, check that the effect you want is identifiable, and estimate it with an interval. Every program on this site is tested: most run on bundled data, and those that need a Welt key run against a fake Welt service."
program = "start.md#first_effect.py"        # complete program (and its recorded output) shown on the landing
secondary = { label = "Python reference", page = "reference" }

[[landing.tasks]]
title = "Discover a graph"
page = "discover-a-graph"
text = "Learn a causal graph from data, with domain knowledge."

[[landing.tasks]]
title = "Check whether an effect is identifiable"
page = "identify-an-effect"
text = "Ask a graph for the formula before you estimate."

[[landing.tasks]]
title = "Estimate an average effect"
page = "estimate-average-effect"
text = "Adjust for confounders and read the interval."

[[landing.tasks]]
title = "Forecast with causal drivers"
page = "forecast-with-drivers"
text = "Forecast series whose drivers you can name."

[[landing.tasks]]
title = "Map a process from an event log"
page = "map-a-process"
text = "See a workflow, then measure what slows it."

[[landing.tasks]]
title = "Discover in Welt, estimate in ergodic"
page = "welt"
text = "Run Welt's hosted models from ergodic."

[reference]
group = "Reference"
# Modules documented one page each (ergodic.<module>), in sidebar order.
modules = [
    ["graph", "Causal graphs"],
    ["data", "Data"],
    ["knowledge", "Domain knowledge"],
    ["identification", "Identification"],
    ["discovery", "Discovery"],
    ["inference", "Effect estimation"],
    ["process", "Process intelligence"],
    ["scm", "Structural causal models"],
    ["forecast", "Forecasting"],
    ["latent", "Hidden regimes"],
    ["datasets", "Datasets"],
]
# Public modules that import an optional dependency: [module, label, import name].
# Documented when the import is available; release CI requires it once published.
optional = [
    ["welt", "Welt bridge", "welt"],
]
# Public modules deliberately left out of the reference: [module, reason].
exclude = []

[notebooks]
page = "notebooks"
title = "Notebooks"
lead = "Download a notebook and run it yourself. Each preview shows the cells with outputs cleared; release CI runs every notebook."

[[notebooks.groups]]
label = "Learn series"
source = "docs/learn"

[[notebooks.groups]]
label = "Case studies"
source = "docs/case-studies"

[examples]
timeout = 180          # seconds per program, unless a fence sets timeout="…"
