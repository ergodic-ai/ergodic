[[groups]]
label = "Structural causal models"
pages = [
    ["Fit a structural causal model", "fit-an-scm"],
    ["Simulate interventions and counterfactuals", "interventions-and-counterfactuals"],
]

[[groups]]
label = "Forecasting"
pages = [
    ["Forecast with causal drivers", "forecast-with-drivers"],
    ["Backtest a forecast", "backtest-a-forecast"],
    ["Reconcile a hierarchy", "reconcile-a-hierarchy"],
    ["Run scenarios", "run-scenarios"],
]

[[groups]]
label = "Hidden regimes"
pages = [
    ["Recover hidden regimes", "recover-hidden-regimes"],
    ["Certify and calibrate", "certify-and-calibrate"],
]

[[groups]]
label = "Process intelligence"
pages = [
    ["Map a process from an event log", "map-a-process"],
    ["Check conformance and decision points", "conformance-and-decisions"],
]

[[groups]]
label = "Concepts"
pages = [
    ["Graphs and edge marks", "graphs-and-marks"],
    ["Assumptions behind each step", "assumptions"],
    ["Glossary", "glossary"],
]

[[groups]]
label = "Notebooks"
pages = [
    ["All notebooks", "notebooks"],
