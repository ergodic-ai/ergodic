[project]
name = "ergodic"
description = "Causal AI: causal discovery, causal inference, and process intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ergodic", email = "andre@ergodic.ai" }]
maintainers = [{ name = "Ergodic", email = "andre@ergodic.ai" }]
keywords = [
    "causal-ai",
    "causality",
    "causal-discovery",
    "causal-inference",
    "process-mining",
    "process-intelligence",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
]

[project.optional-dependencies]
# Bayesian learners (PyMCLearner). Optional: the core install never imports pymc.
bayes = ["pymc>=5"]
# The SCM pillar (ergodic.scm). Same pymc dependency as `bayes`, named so it
# reads as `pip install ergodic[scm]`. The bare install never imports pymc.
scm = ["pymc>=5"]
# The forecasting pillar (ergodic.forecast). Same pymc dependency again; the bare
# install never imports it. Sampling goes through PyMC's JAX backend when jax and
# numpyro are present, which the S0 spike measured at 4x the C backend on the
# workhorse model, so installing them alongside is worth it; the pillar runs
# without them.
forecast = ["pymc>=5"]
# The latent pillar (ergodic.latent). Same pymc dependency once more; the bare
# install never imports it. The forward-marginalized switching models sample
# through PyMC's JAX backend when jax and numpyro are present, same measured
# speedup as the forecast pillar, so installing them alongside is worth it.
latent = ["pymc>=5"]
# Welt's hosted foundation models (ergodic.welt): Welt causal discovery, the
# WeltLearner and the data bridge. Only ergodic.welt imports welt-client; the bare
# install never does. welt-client supports Python 3.11 to 3.13, so the extra is
# empty on 3.14 until it adds support (DEC-078).
welt = ["welt-client>=0.13; python_version < '3.14'"]
# Neural CATE learners (TARNet / DragonNet / CFR). A reserved seam: phase 1 ships
# no module that imports torch; the registry points here when one is selected.
neural = ["torch>=2.2"]
# Foundation-model CATE learners (the in-context / PFN causal estimators). Also a
# reserved seam, unused in phase 1.
foundation = ["torch>=2.2"]

[project.urls]
Homepage = "https://ergodic.dev"
Documentation = "https://ergodic.dev"
Source = "https://github.com/ergodic-ai/ergodic"
Changelog = "https://ergodic.dev/changelog.html"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "pymc>=5",
    "scikit-learn>=1.9.0",
    # The forecast pillar's sampler path: PyMC through its JAX backend. Not in
    # the `forecast` extra (the floor stays pymc alone), but the tests run on it,
    # because the S0 spike measured it 4x faster than the C backend on exactly
    # the model the forecaster fits.
    "jax>=0.4",
    "numpyro>=0.15",
    # The documentation builder (scripts/docsite) renders with Python-Markdown; the
    # docs tests in `make check` import it.
    "markdown>=3.6",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # The learn series: py:percent notebooks executed at build time.
    "mkdocs-jupyter>=0.25",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    # The Graphite documentation builder (scripts/docsite, API-143).
    "markdown>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ergodic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ergodic"]

[tool.hatch.build.targets.sdist]
# Ship the package, tests, docs, and the user-facing metadata; keep local
# tooling and agent config out of the distribution.
exclude = [
    ".claude",
    ".devcontainer",
    ".github",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".python-version",
    "CLAUDE.md",
    "Makefile",
    "RELEASING.md",
    "deploy",
    "mkdocs.yml",
    "plans",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# The learn notebooks and case studies: cells import where the narrative needs them
# (E402) and end on a bare expression so the rendered notebook displays it (B018).
"docs/learn/*.py" = ["E402", "B018"]
"docs/case-studies/*.py" = ["E402", "B018"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy rides in with pymc (the spectral null fit optimizes with it).
module = ["pymc.*", "pytensor.*", "arviz.*", "xarray.*", "numpyro.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdown.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# welt-client ships no type information; it is only imported by ergodic.welt and
# its tests, and httpx only by those tests (both absent without the welt extra).
module = ["welt.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
# The documentation builder (scripts/docsite) is tested from tests/test_docsite.py.
pythonpath = ["."]

[tool.coverage.run]
source = ["ergodic"]
branch = true

[tool.coverage.report]
show_missing = true
