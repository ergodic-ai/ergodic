[project]
name = "ergodic"
description = "Causal AI: causal discovery, causal inference, and process intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ergodic", email = "andre@ergodic.ai" }]
maintainers = [{ name = "Ergodic", email = "andre@ergodic.ai" }]
keywords = [
    "causal-ai",
    "causality",
    "causal-discovery",
    "causal-inference",
    "process-mining",
    "process-intelligence",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
]

[project.optional-dependencies]
# Bayesian learners (PyMCLearner). Optional: the core install never imports pymc.
bayes = ["pymc>=5"]
# The SCM pillar (ergodic.scm). Same pymc dependency as `bayes`, named so it
# reads as `pip install ergodic[scm]`. The bare install never imports pymc.
scm = ["pymc>=5"]

[project.urls]
Homepage = "https://ergodic.ai"
Documentation = "https://ergodic.ai"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "pymc>=5",
    "scikit-learn>=1.9.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # The learn series: py:percent notebooks executed at build time.
    "mkdocs-jupyter>=0.25",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ergodic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ergodic"]

[tool.hatch.build.targets.sdist]
# Ship the package, tests, docs, and the user-facing metadata; keep local
# tooling and agent config out of the distribution.
exclude = [
    ".claude",
    ".devcontainer",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".python-version",
    "CLAUDE.md",
    "Makefile",
    "deploy",
    "mkdocs.yml",
    "plans",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# The learn notebooks and case studies: cells import where the narrative needs them
# (E402) and end on a bare expression so the rendered notebook displays it (B018).
"docs/learn/*.py" = ["E402", "B018"]
"docs/case-studies/*.py" = ["E402", "B018"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymc.*", "pytensor.*", "arviz.*", "xarray.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ergodic"]
branch = true

[tool.coverage.report]
show_missing = true
